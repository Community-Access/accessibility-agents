# Codex interface for this skill.
# Specialists and helpers are dispatched by a router, never picked implicitly,
# so they stay out of the model-facing catalog and its two percent cap.
interface:
  display_name: "Accessibility Lead"
  short_description: "Web UI accessibility lead. Use before writing or changing HTML, JSX, TSX, Vue, Svelte, CSS or templates. Picks specialists and merges their findings."
policy:
  allow_implicit_invocation: true
