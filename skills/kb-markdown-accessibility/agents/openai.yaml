# Codex interface for this skill.
# Reference skills are lookup data cited by other skills, never chosen by the
# model on its own. Without this file Codex lists them in its catalog, which a
# live probe showed put all 29 into the model prompt.
interface:
  display_name: "Markdown Accessibility"
  short_description: "Reference data, not a reviewer. Audit and fix markdown for accessibility. Covers ambiguous links, anchors, emoji (remove/translate), Mermaid/ASCII templates, heading hierarchy, table descriptions, and severity scoring."
policy:
  allow_implicit_invocation: false
