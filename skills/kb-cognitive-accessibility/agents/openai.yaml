# Codex interface for this skill.
# Reference skills are lookup data cited by other skills, never chosen by the
# model on its own. Without this file Codex lists them in its catalog, which a
# live probe showed put all 29 into the model prompt.
interface:
  display_name: "Cognitive Accessibility"
  short_description: "Reference data, not a reviewer. Review UI for cognitive load, plain language clarity, and WCAG 2.2 cognitive SC (3.3.7, 3.3.8, 3.3.9). Includes COGA guidance, reading level, auth patterns, and timeout warnings."
policy:
  allow_implicit_invocation: false
