# Codex interface for this skill.
# Reference skills are lookup data cited by other skills, never chosen by the
# model on its own. Without this file Codex lists them in its catalog, which a
# live probe showed put all 29 into the model prompt.
interface:
  display_name: "Mobile Accessibility"
  short_description: "Reference data, not a reviewer. Audit React Native, Expo, iOS, Android for accessibility. Review accessibilityLabel, accessibilityRole, accessibilityHint, touch targets (44x44pt min), screen reader support, and platform semantics."
policy:
  allow_implicit_invocation: false
