# Codex interface for this skill.
# Reference skills are lookup data cited by other skills, never chosen by the
# model on its own. Without this file Codex lists them in its catalog, which a
# live probe showed put all 29 into the model prompt.
interface:
  display_name: "Severity Mapping"
  short_description: "Reference data, not a reviewer. Canonical severity level definitions and cross-domain mapping for web, document, and markdown audits. Score impact ranges, WCAG conformance alignment, and cross-format normalization."
policy:
  allow_implicit_invocation: false
