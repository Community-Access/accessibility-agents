# Codex interface for this skill.
# Reference skills are lookup data cited by other skills, never chosen by the
# model on its own. Without this file Codex lists them in its catalog, which a
# live probe showed put all 29 into the model prompt.
interface:
  display_name: "Web Scanning"
  short_description: "Reference data, not a reviewer. Web content discovery, URL crawling, and page inventory for accessibility audits. Use when scanning web pages, crawling sites for audit scope, or building page inventories for multi-page audits."
policy:
  allow_implicit_invocation: false
