name: Plugin branch

# Keeps two branches equal to the plugin alone, built by
# scripts/build-claude-plugin.mjs from main, so the stores review and install
# the skills, hooks and MCP server without the repository's tooling:
#   plugin          the tree at the root, for the Claude plugin directory;
#                   tagged plugin-v<version> on the first build of a version.
#   copilot-plugin  the same tree in accessibility-agents/, for Awesome
#                   Copilot; tagged copilot-plugin-v<version>-<main sha>.

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'plugin.json'
      - 'mcp.json'
      - 'com.github.copilot/**'
      - 'skills/**'
      - 'hooks/hooks.json'
      - 'hooks/guard.mjs'
      - 'mcp-server/dist/**'
      - 'mcp-server/package.json'
      - 'README.md'
      - 'PRIVACY.md'
      - 'LICENSE'
      - 'scripts/build-claude-plugin.mjs'
      - '.github/workflows/plugin-branch.yml'
  workflow_dispatch:

concurrency:
  group: plugin-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build the plugin tree
        run: |
          node scripts/build-claude-plugin.mjs "$RUNNER_TEMP/plugin"
          # Awesome Copilot installs a plugin from a folder inside the tagged
          # tree; its installer rejects the repository root ("/"). The same
          # tree goes in an accessibility-agents/ folder on copilot-plugin.
          mkdir -p "$RUNNER_TEMP/copilot"
          cp -a "$RUNNER_TEMP/plugin" "$RUNNER_TEMP/copilot/accessibility-agents"

      - name: Commit the trees to their branches and tag them
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          version=$(node -p "require('./.claude-plugin/plugin.json').version")

          # publish <branch> <tree> <tag>: make <branch> equal to <tree>, then
          # tag its head as <tag> unless that tag already exists.
          publish() {
            local branch=$1 tree=$2 tag=$3 dir="$RUNNER_TEMP/wt-$1"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              git fetch --depth 1 origin "$branch"
              git worktree add "$dir" FETCH_HEAD
              git -C "$dir" checkout -B "$branch"
            else
              git worktree add --orphan -b "$branch" "$dir"
            fi
            find "$dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$tree/." "$dir/"
            git -C "$dir" add -A
            if git -C "$dir" diff --cached --quiet; then
              echo "$branch is already current."
            else
              git -C "$dir" commit -m "Plugin ${version} built from main ${GITHUB_SHA::7}"
              git -C "$dir" push origin "$branch"
            fi
            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              git -C "$dir" tag "$tag"
              git -C "$dir" push origin "$tag"
            fi
          }

          # The Claude plugin directory follows the plugin branch. One tag per
          # version, on the first build of that version.
          publish plugin "$RUNNER_TEMP/plugin" "plugin-v${version}"
          # Awesome Copilot pins a tag and its commit: one tag per build, so a
          # fix within a version still gets an immutable ref to submit.
          publish copilot-plugin "$RUNNER_TEMP/copilot" "copilot-plugin-v${version}-${GITHUB_SHA::7}"
