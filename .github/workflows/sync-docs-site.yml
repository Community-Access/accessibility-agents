name: Sync Documentation to Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'ROADMAP.md'
      - 'SECURITY.md'

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout accessibility-agents
        uses: actions/checkout@v7

      - name: Build docs manifest
        run: |
          echo '{ "generated": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'", "sections": [' > manifest.json

          # Getting Started
          echo '{"name":"Getting Started","id":"getting-started","items":[' >> manifest.json
          first=true
          for f in docs/getting-started/README.md docs/reference/configuration.md docs/architecture/README.md; do
            if [ -f "$f" ]; then
              title=$(head -5 "$f" | grep -m1 '^#' | sed 's/^#\+ //')
              [ -z "$title" ] && title=$(basename "$f" .md | sed 's/-/ /g')
              $first || echo ',' >> manifest.json
              echo "{\"path\":\"$f\",\"title\":\"$title\"}" >> manifest.json
              first=false
            fi
          done
          echo ']},' >> manifest.json

          # Agents
          echo '{"name":"Skills","id":"agents","items":[' >> manifest.json
          first=true
          for f in docs/reference/skills/README.md $(find docs/reference/skills -name '*.md' ! -name 'README.md' | sort); do
            if [ -f "$f" ]; then
              title=$(head -5 "$f" | grep -m1 '^#' | sed 's/^#\+ //')
              [ -z "$title" ] && title=$(basename "$f" .md | sed 's/-/ /g')
              $first || echo ',' >> manifest.json
              echo "{\"path\":\"$f\",\"title\":\"$title\"}" >> manifest.json
              first=false
            fi
          done
          echo ']},' >> manifest.json

          # Skills
          echo '{"name":"Knowledge domains","id":"skills","items":[' >> manifest.json
          first=true
          for f in $(find docs/reference/knowledge-domains -name '*.md' | sort); do
            if [ -f "$f" ]; then
              title=$(head -5 "$f" | grep -m1 '^#' | sed 's/^#\+ //')
              [ -z "$title" ] && title=$(basename "$f" .md | sed 's/-/ /g')
              $first || echo ',' >> manifest.json
              echo "{\"path\":\"$f\",\"title\":\"$title\"}" >> manifest.json
              first=false
            fi
          done
          echo ']},' >> manifest.json

          # Tools
          echo '{"name":"Tools","id":"tools","items":[' >> manifest.json
          first=true
          for f in $(find docs/reference/tools -name '*.md' | sort); do
            if [ -f "$f" ]; then
              title=$(head -5 "$f" | grep -m1 '^#' | sed 's/^#\+ //')
              [ -z "$title" ] && title=$(basename "$f" .md | sed 's/-/ /g')
              $first || echo ',' >> manifest.json
              echo "{\"path\":\"$f\",\"title\":\"$title\"}" >> manifest.json
              first=false
            fi
          done
          echo ']},' >> manifest.json

          # Scanning
          echo '{"name":"Scanning","id":"scanning","items":[' >> manifest.json
          first=true
          for f in $(find docs/guides/scanning -name '*.md' | sort); do
            if [ -f "$f" ]; then
              title=$(head -5 "$f" | grep -m1 '^#' | sed 's/^#\+ //')
              [ -z "$title" ] && title=$(basename "$f" .md | sed 's/-/ /g')
              $first || echo ',' >> manifest.json
              echo "{\"path\":\"$f\",\"title\":\"$title\"}" >> manifest.json
              first=false
            fi
          done
          echo ']},' >> manifest.json

          # Advanced
          echo '{"name":"Advanced","id":"advanced","items":[' >> manifest.json
          first=true
          for f in $(find docs/guides/advanced -name '*.md' | sort); do
            if [ -f "$f" ]; then
              title=$(head -5 "$f" | grep -m1 '^#' | sed 's/^#\+ //')
              [ -z "$title" ] && title=$(basename "$f" .md | sed 's/-/ /g')
              $first || echo ',' >> manifest.json
              echo "{\"path\":\"$f\",\"title\":\"$title\"}" >> manifest.json
              first=false
            fi
          done
          echo ']},' >> manifest.json

          # Project root files
          echo '{"name":"Project","id":"project","items":[' >> manifest.json
          first=true
          for f in README.md CONTRIBUTING.md CODE_OF_CONDUCT.md ROADMAP.md SECURITY.md; do
            if [ -f "$f" ]; then
              title=$(head -5 "$f" | grep -m1 '^#' | sed 's/^#\+ //')
              [ -z "$title" ] && title=$(basename "$f" .md)
              $first || echo ',' >> manifest.json
              echo "{\"path\":\"$f\",\"title\":\"$title\"}" >> manifest.json
              first=false
            fi
          done
          echo ']}' >> manifest.json

          echo ']}' >> manifest.json

          # Validate JSON
          python3 -m json.tool manifest.json > /dev/null

          # Only the timestamp changed: keep the committed file, so no pull
          # request is opened for a manifest whose pages are the same.
          strip='1s/"generated": "[^"]*"//'
          if git show HEAD:manifest.json 2>/dev/null | sed "$strip" | diff -q - <(sed "$strip" manifest.json) >/dev/null; then
            git checkout -- manifest.json
            echo "Docs pages unchanged; manifest left as committed."
          fi

      - name: Create pull request with manifest
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          commit-message: "chore: update docs manifest [skip ci]"
          title: "chore: update docs manifest"
          body: |
            Automated update of `manifest.json` from docs/ changes.
            This PR is auto-generated by the Sync Documentation to Site workflow.
          branch: chore/update-manifest
          delete-branch: true
