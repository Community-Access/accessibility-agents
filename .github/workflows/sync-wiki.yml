name: Sync Docs to Wiki

# The wiki mirrors docs/: every page comes from a file in the repository, and a
# page with no source is removed. Home and the sidebar are in .github/wiki/.
# See scripts/sync-wiki.mjs.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/wiki/**'
      - 'scripts/sync-wiki.mjs'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Checkout wiki
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Sync docs to wiki
        run: node scripts/sync-wiki.mjs wiki

      - name: Push
        working-directory: wiki
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync docs from repo (automated)"
          git push
