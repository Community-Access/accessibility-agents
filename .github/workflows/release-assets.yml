name: Release assets

# Attaches the Gemini CLI extension archive to each published release.
# Gemini installs an extension from a release asset with gemini-extension.json
# at its root; see scripts/build-gemini-extension.mjs for why it is built
# separately rather than kept at the repository root.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the archive to (for example v7.1.0)'
        required: true

permissions:
  contents: write

jobs:
  gemini-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build the Gemini extension archive
        run: node scripts/build-gemini-extension.mjs

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/accessibility-agents.tar.gz --clobber

  # Publishes the MCP server to npm, then lists it in the MCP Registry under
  # io.github.Community-Access. Needs an NPM_TOKEN repository secret with
  # publish rights to the @community-access npm scope; the registry step
  # authenticates with this workflow's GitHub OIDC token, which proves the
  # repository belongs to the Community-Access organization.
  mcp-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check versions agree
        run: node scripts/check-release-consistency.js

      - name: Test the MCP server
        run: |
          npm ci --prefix mcp-server --ignore-scripts
          npm test --prefix mcp-server
          node scripts/check-mcp-bundle.mjs

      - name: Publish the package to npm
        working-directory: mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add an NPM_TOKEN repository secret with publish rights to @community-access."
            exit 1
          fi
          npm publish --provenance --access public

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
